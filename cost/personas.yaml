# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)
# Thay mọi dòng "(ví dụ)" bằng số và nguồn của nhóm; simulate nhắc nếu còn sót.

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số nhóm gia đình dùng trợ lý mỗi tháng ở chuỗi VinWonders — 3 kịch bản (mỗi nhóm-lượt đi chơi = 1 người dùng)
  low: 1265         # 1% của ≈126.500 nhóm-lượt gia đình có trẻ / tháng
  base: 6325        # 5%
  high: 12650       # 10%
  source: "Quy mô: chuỗi VinWonders 9,11 triệu lượt khách năm 2025 (Vinpearl, https://doanhnhan.baophapluat.vn/vinpearl-vpl-doanh-thu-nam-2025-vuot-15-500-ty-dong-mang-khach-san-tang-truong-34.html, 30/01/2026) ÷ 3 người/nhóm (phỏng vấn P1–P3) × 50% gia đình có trẻ (tự ước tính) ÷ 12 ≈ 126.500 nhóm-lượt/tháng — xem spec.md §2. Tỉ lệ dùng trợ lý 1% / 5% / 10% (tự ước tính)."

personas:           # 3 kiểu dùng theo checklist C1; share cộng lại = 1
  - name: lap_lich_mot_lan
    share: 0.5              # xếp lịch một lần trước khi đi
    uses_per_month: 1
    turns_per_session: 2    # gửi yêu cầu, sửa một điều kiện
    source: "share (tự ước tính). 2 lượt = 1 yêu cầu + 1 lần đổi nhỏ, như P3 (chuẩn bị kỹ, đổi kế hoạch 1 lần). 1 phiên / lượt đi chơi."
  - name: chinh_truoc_chuyen
    share: 0.3              # chỉnh nhiều lần trước ngày đi (đổi giờ về, ngân sách, điểm bắt buộc)
    uses_per_month: 1
    turns_per_session: 4
    source: "(tự ước tính) phỏng vấn P1–P3 không hỏi số lần sửa kế hoạch trước chuyến; chuẩn bị mất 15–60 phút (P1–P3 câu 2)"
  - name: xep_lai_giua_buoi
    share: 0.2              # show huỷ, đến muộn: xếp lại phần còn lại của ngày
    uses_per_month: 1
    turns_per_session: 3
    types: [kho, thuong]
    source: "share 0.2 = khảo sát 28/11: 2/10 người (mẫu qua sàng lọc, trong hạn) phải đổi kế hoạch vì trở ngại về giờ / điểm đóng / điều kiện — loại trở ngại trợ lý xếp lại được; xếp hàng (3/5 người đổi vì trở ngại) không tính vì bản chạy không có dữ liệu hàng chờ (evidence/summary.md#khao-sat; mẫu không chỉ phụ huynh, N = 10). 3 lượt = 1 yêu cầu + 2 lần xếp lại: P1 và P2 đổi kế hoạch giữa ngày 2 lần (P3: 1 lần); 3/3 có trò định chơi mà không chơi được (evidence/summary.md). R01, R07, R08 (data-mining.md) có trò đóng, vào muộn."
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).
# Persona hỏi kiểu riêng: thêm vào persona đó
#     types: [thuong, kho, tu_choi]
# hoặc
#     inputs: ["câu hỏi kiểu 1", "câu hỏi kiểu 2"]

prices:             # USD / 1 triệu token — further-reading/model-prices.csv của repo đề (BTC tra ngày 25/11/2026)
  - model: gemini-3.1-flash-lite
    input: 0.25
    output: 1.50
    source: "https://ai.google.dev/gemini-api/docs/pricing · paid tier · xem 25/11/2026 (model-prices.csv)"
  - model: gemini-3.8-flash
    input: 1.50
    output: 7.50
    source: "https://ai.google.dev/gemini-api/docs/pricing · giá từ 01/01/2027 · xem 25/11/2026 (model-prices.csv)"

usd_to_vnd:         # tuỳ chọn: điền thì bản tóm tắt in thêm tiền Việt
  rate:
  source:
